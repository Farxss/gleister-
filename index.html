<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje para Gleister</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; /* Fondo oscuro moderno */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .mensaje-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem; /* Tamaño de letra grande */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.2;
            background: linear-gradient(to right, #ff416c, #ff4b2b); /* Degradado llamativo */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem; /* Ajuste para pantallas móviles */
            }
        }
    </style>
</head>
<body>

    <div class="mensaje-container">
        <h1>Gleister es awebao e indio</h1>
    </div>

</body>
</html>
